[package]
name = "ctf-forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ctf-forge"
path = "src/main.rs"

[dependencies]
num-bigint = { workspace = true }
num-traits = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
ureq = { version = "2", features = ["json", "tls"] }
ctf-core = { path = "../ctf-core" }
ctf-codec = { path = "../ctf-codec" }
ctf-crypto = { path = "../ctf-crypto" }
ctf-sidecar = { path = "../ctf-sidecar" }
ctf-parse = { path = "../ctf-parse" }
ctf-net = { path = "../ctf-net" }
