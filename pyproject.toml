[project]
name = "auto-ctf"
version = "0.1.0"
description = "CTF2 platform automation skeleton: Open API client, CLI, and tests"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auto-ctf = "ctf2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real CTF2 API (deselect with '-m \"not live\"')",
]
